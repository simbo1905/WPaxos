# log4j2 properties configuration, read by sample/simple/SimpleClient from
# <rootPath>/conf/log4j.properties before any logger is created.
#
# The load generator's logger is com.wuba.wpaxos.sample.simple.SimpleClient, which sits *under*
# com.wuba.wpaxos, so it cannot be separated from the library by package prefix alone. The root
# logger is therefore WARN -- which keeps the library's ERROR lines (failed commits, unsatisfied
# links) and silences its INFO chatter from every communication thread -- and the one load
# generator logger is named explicitly at INFO. The result is that the only INFO line in the log
# is the "average qps" figure, which is what gets grepped.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = stdout

appender.console.type = Console
appender.console.name = stdout
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5level [%t] %logger{1} - %msg%n

logger.loadgen.name = com.wuba.wpaxos.sample.simple.SimpleClient
logger.loadgen.level = info
logger.loadgen.additivity = false
logger.loadgen.appenderRef.stdout.ref = stdout
